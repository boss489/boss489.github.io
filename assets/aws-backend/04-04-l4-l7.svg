<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.t{font-size:24px;font-weight:700}.l{font-size:21px;font-weight:700}.s{font-size:17px}.b{fill:#fff;stroke:#334155;stroke-width:2;rx:8}.l4{fill:#fef3c7;stroke:#b45309;stroke-width:2;rx:8}.l7{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:8}</style><text x="70" y="60" class="t">L4 passes connections, L7 reads HTTP</text><rect x="90" y="125" width="430" height="250" class="b"/><text x="125" y="170" class="l">HTTP Request</text><text x="125" y="220" class="s">GET /api/orders HTTP/1.1</text><text x="125" y="250" class="s">Host: api.example.com</text><text x="125" y="280" class="s">Header: Authorization</text><rect x="610" y="125" width="200" height="110" class="l4"/><text x="685" y="170" class="l">L4</text><text x="645" y="200" class="s">TCP/UDP only</text><rect x="610" y="265" width="200" height="110" class="l7"/><text x="685" y="310" class="l">L7</text><text x="635" y="340" class="s">Host, Path, Header</text><text x="850" y="205" class="s">NLB</text><text x="850" y="345" class="s">ALB</text></svg>
