<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Compute runtime layers</title>
  <desc id="desc">A Spring Boot service runs on Linux directly or inside Docker, often managed by systemd.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 700; }
    .small { font-size: 17px; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
    .app { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 8; }
    .runtime { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
    .host { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 8; }
  </style>
  <text x="70" y="60" class="title">Spring Boot runtime on EC2</text>
  <rect x="160" y="120" width="800" height="70" class="app"/>
  <text x="455" y="164" class="label">Spring Boot Application</text>
  <rect x="160" y="220" width="370" height="70" class="runtime"/>
  <text x="285" y="264" class="label">Docker Container</text>
  <rect x="590" y="220" width="370" height="70" class="runtime"/>
  <text x="715" y="264" class="label">Systemd Service</text>
  <rect x="160" y="320" width="800" height="70" class="host"/>
  <text x="455" y="364" class="label">Linux OS</text>
  <rect x="160" y="420" width="800" height="70" class="box"/>
  <text x="435" y="464" class="label">EC2 Instance</text>
</svg>
