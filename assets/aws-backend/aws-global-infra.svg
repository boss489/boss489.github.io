<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">AWS global infrastructure</title>
  <desc id="desc">AWS global infrastructure is organized into regions, availability zones, and edge locations.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 700; }
    .small { font-size: 17px; }
    .region { fill: #f8fafc; stroke: #0f172a; stroke-width: 3; rx: 12; }
    .az { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
    .edge { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 8; }
  </style>
  <text x="70" y="60" class="title">Region contains multiple isolated Availability Zones</text>
  <rect x="80" y="105" width="650" height="365" class="region"/>
  <text x="115" y="150" class="label">Region: ap-northeast-2</text>
  <rect x="125" y="190" width="250" height="210" class="az"/>
  <text x="165" y="235" class="label">AZ 2a</text>
  <text x="160" y="275" class="small">Data center group</text>
  <text x="160" y="305" class="small">Independent power</text>
  <text x="160" y="335" class="small">Low latency link</text>
  <rect x="435" y="190" width="250" height="210" class="az"/>
  <text x="475" y="235" class="label">AZ 2c</text>
  <text x="470" y="275" class="small">Data center group</text>
  <text x="470" y="305" class="small">Independent failure</text>
  <text x="470" y="335" class="small">Multi-AZ placement</text>
  <rect x="800" y="145" width="240" height="85" class="edge"/>
  <text x="850" y="195" class="label">Edge Location</text>
  <rect x="800" y="270" width="240" height="85" class="edge"/>
  <text x="846" y="320" class="label">CloudFront</text>
  <rect x="800" y="395" width="240" height="85" class="edge"/>
  <text x="858" y="445" class="label">Route 53</text>
</svg>
