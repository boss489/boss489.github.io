<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">EC2 instance anatomy</title>
  <desc id="desc">An EC2 instance is created from an AMI and attached to EBS storage and ENI networking.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .small { font-size: 17px; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .compute { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .storage { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 8; }
      .network { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 8; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="70" y="60" class="title">EC2 is compute plus image, disk, and network</text>
  <rect x="425" y="170" width="270" height="190" class="compute"/>
  <text x="485" y="220" class="label">EC2 Instance</text>
  <rect x="465" y="250" width="190" height="45" class="box"/>
  <text x="505" y="279" class="small">CPU / Memory</text>
  <rect x="465" y="305" width="190" height="45" class="box"/>
  <text x="525" y="334" class="small">Linux</text>
  <rect x="90" y="130" width="250" height="100" class="box"/>
  <text x="175" y="188" class="label">AMI</text>
  <rect x="90" y="330" width="250" height="100" class="storage"/>
  <text x="175" y="388" class="label">EBS</text>
  <rect x="780" y="235" width="250" height="100" class="network"/>
  <text x="870" y="293" class="label">ENI</text>
  <path d="M340 180 L425 230" class="line"/>
  <path d="M340 380 L425 320" class="line"/>
  <path d="M695 285 L780 285" class="line"/>
</svg>
