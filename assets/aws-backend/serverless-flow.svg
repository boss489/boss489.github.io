  <text x="70" y="60" class="title">Serverless API and event workflow</text>
  <rect x="80" y="165" width="190" height="80" class="api"/><text x="115" y="213" class="label">API Gateway</text>
  <rect x="80" y="305" width="190" height="80" class="api"/><text x="125" y="353" class="label">EventBridge</text>
  <rect x="420" y="235" width="190" height="90" class="fn"/><text x="475" y="288" class="label">Lambda</text>
  <rect x="760" y="165" width="220" height="80" class="data"/><text x="815" y="213" class="label">DynamoDB</text>
  <rect x="760" y="305" width="220" height="80" class="data"/><text x="805" y="353" class="label">Step Functions</text>
  <path d="M270 205 C340 210 360 245 420 265" class="line"/><path d="M270 345 C340 340 360 315 420 295" class="line"/><path d="M610 265 C675 240 700 215 760 205" class="line"/><path d="M610 295 C675 320 700 340 760 345" class="line"/>
</svg>
