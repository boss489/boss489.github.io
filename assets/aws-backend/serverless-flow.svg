<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Serverless event flow</title>
  <desc id="desc">API Gateway and EventBridge invoke Lambda functions that use DynamoDB and Step Functions.</desc>
