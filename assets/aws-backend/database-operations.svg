<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">RDS and Aurora operations</title>
  <desc id="desc">Application traffic writes to a primary database, failover uses standby, read replicas serve read queries, and backups support restore.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.label{font-size:21px;font-weight:700}.small{font-size:17px}.app{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:8}.db{fill:#e0f2fe;stroke:#0369a1;stroke-width:2;rx:8}.backup{fill:#fef3c7;stroke:#b45309;stroke-width:2;rx:8}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="70" y="60" class="title">Database availability and recovery</text>
  <rect x="90" y="215" width="180" height="80" class="app"/><text x="130" y="263" class="label">Spring Boot</text>
  <rect x="390" y="160" width="220" height="100" class="db"/><text x="455" y="205" class="label">Primary</text><text x="450" y="232" class="small">RDS / Aurora</text>
  <rect x="390" y="330" width="220" height="100" class="db"/><text x="455" y="375" class="label">Standby</text><text x="455" y="402" class="small">Multi-AZ</text>
  <rect x="760" y="160" width="220" height="100" class="db"/><text x="815" y="205" class="label">Read Replica</text><text x="830" y="232" class="small">read scale</text>
  <rect x="760" y="330" width="220" height="100" class="backup"/><text x="835" y="375" class="label">Backup</text><text x="830" y="402" class="small">restore point</text>
  <path d="M270 255 L390 210" class="line"/><path d="M500 260 L500 330" class="line"/><path d="M610 210 L760 210" class="line"/><path d="M610 235 C690 280 700 350 760 380" class="line"/>
</svg>
