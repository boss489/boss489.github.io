<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Security Group and NACL scope</title>
  <desc id="desc">NACL applies to a subnet, while security groups apply to ALB, application server, and database resources.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subnet { fill: #f8fafc; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; rx: 12; }
      .sg { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .label { font-size: 22px; font-weight: 700; }
      .small { font-size: 17px; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="70" y="60" class="label">Security control scopes</text>

  <rect x="70" y="110" width="980" height="360" class="subnet"/>
  <text x="100" y="150" class="label">Subnet boundary: NACL applies here</text>

  <rect x="135" y="220" width="220" height="120" class="sg"/>
  <text x="172" y="258" class="small">ALB Security Group</text>
  <rect x="170" y="278" width="150" height="45" class="box"/>
  <text x="214" y="307" class="small">ALB</text>

  <rect x="450" y="220" width="220" height="120" class="sg"/>
  <text x="478" y="258" class="small">App Security Group</text>
  <rect x="485" y="278" width="150" height="45" class="box"/>
  <text x="516" y="307" class="small">Spring Boot</text>

  <rect x="765" y="220" width="220" height="120" class="sg"/>
  <text x="793" y="258" class="small">DB Security Group</text>
  <rect x="800" y="278" width="150" height="45" class="box"/>
  <text x="852" y="307" class="small">RDS</text>

  <path d="M355 300 L450 300" class="line"/>
  <text x="372" y="285" class="small">8080</text>
  <path d="M670 300 L765 300" class="line"/>
  <text x="687" y="285" class="small">3306</text>

  <text x="145" y="390" class="small">SG: 리소스 단위, 상태 저장</text>
  <text x="145" y="420" class="small">NACL: Subnet 단위, 상태 비저장</text>
</svg>
