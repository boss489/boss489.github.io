<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">SSH access path</title>
  <desc id="desc">An operator connects to an EC2 instance through SSH using a key pair and security group rule.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .small { font-size: 17px; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .public { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .private { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 8; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="70" y="60" class="title">SSH access needs identity and network permission</text>
  <rect x="90" y="170" width="220" height="110" class="box"/>
  <text x="145" y="215" class="label">Operator</text>
  <text x="135" y="250" class="small">private key</text>
  <rect x="440" y="150" width="240" height="150" class="public"/>
  <text x="485" y="195" class="label">Security Group</text>
  <text x="485" y="235" class="small">TCP 22 allowed</text>
  <text x="485" y="265" class="small">source restricted</text>
  <rect x="810" y="170" width="220" height="110" class="private"/>
  <text x="875" y="215" class="label">EC2</text>
  <text x="860" y="250" class="small">sshd</text>
  <path d="M310 225 L440 225" class="line"/>
  <path d="M680 225 L810 225" class="line"/>
</svg>
