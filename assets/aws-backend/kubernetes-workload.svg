<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes workload hierarchy</title>
  <desc id="desc">Ingress routes to Service, Service selects Pods, and Deployment manages ReplicaSets and Pods.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.label{font-size:21px;font-weight:700}.small{font-size:17px}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:8}.net{fill:#e0f2fe;stroke:#0369a1;stroke-width:2;rx:8}.work{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:8}.ctl{fill:#fef3c7;stroke:#b45309;stroke-width:2;rx:8}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="70" y="60" class="title">Kubernetes request and workload objects</text>
  <rect x="90" y="230" width="160" height="80" class="box"/><text x="130" y="278" class="label">Client</text>
  <rect x="330" y="230" width="160" height="80" class="net"/><text x="375" y="278" class="label">Ingress</text>
  <rect x="570" y="230" width="160" height="80" class="net"/><text x="625" y="278" class="label">Service</text>
  <rect x="810" y="150" width="220" height="240" class="work"/><text x="855" y="195" class="label">Pods</text><rect x="850" y="225" width="140" height="45" class="box"/><text x="905" y="254" class="small">Pod</text><rect x="850" y="295" width="140" height="45" class="box"/><text x="905" y="324" class="small">Pod</text>
  <rect x="330" y="390" width="400" height="80" class="ctl"/><text x="405" y="438" class="label">Deployment -> ReplicaSet</text>
  <path d="M250 270 L330 270" class="line"/><path d="M490 270 L570 270" class="line"/><path d="M730 270 L810 270" class="line"/><path d="M530 390 C600 345 700 330 850 318" class="line"/>
</svg>
