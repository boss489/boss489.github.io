<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">ECS deployment flow</title>
  <desc id="desc">Docker image is pushed to ECR and ECS service runs tasks in a cluster behind an ALB.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.label{font-size:21px;font-weight:700}.small{font-size:17px}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:8}.repo{fill:#fef3c7;stroke:#b45309;stroke-width:2;rx:8}.ecs{fill:#e0f2fe;stroke:#0369a1;stroke-width:2;rx:8}.task{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:8}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="70" y="60" class="title">ECR image to ECS service</text>
  <rect x="80" y="210" width="170" height="80" class="box"/><text x="125" y="258" class="label">Docker</text>
  <rect x="320" y="210" width="170" height="80" class="repo"/><text x="380" y="258" class="label">ECR</text>
  <rect x="560" y="130" width="470" height="280" class="ecs"/><text x="600" y="175" class="label">ECS Cluster</text>
  <rect x="610" y="220" width="170" height="80" class="task"/><text x="665" y="255" class="label">Service</text><text x="640" y="282" class="small">desired count</text>
  <rect x="820" y="220" width="170" height="80" class="task"/><text x="875" y="255" class="label">Task</text><text x="860" y="282" class="small">container</text>
  <path d="M250 250 L320 250" class="line"/><path d="M490 250 L610 250" class="line"/><path d="M780 260 L820 260" class="line"/>
</svg>
